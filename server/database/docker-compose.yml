services:
  # Mongodb service
  mongo_db:
    container_name: db_container
    image: ${LOCAL_MONGO_IMAGE:-mongo:latest}
    pull_policy: never
    ports:
      - 27017:27017
    restart: always
    volumes:
      - mongo_data:/data/db

  # Node api service
  api:
    image: ${LOCAL_API_IMAGE:-nodeapp}
    pull_policy: never
    ports:
      - 3030:3030
    depends_on: 
      - mongo_db

volumes:
  mongo_data: {}
